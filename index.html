<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>本地文件哈希校验工具 (带速度显示)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/spark-md5/3.0.2/spark-md5.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsSHA/3.3.1/sha.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background-color: #f4f4f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; color: #333; }
        .container { background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,.1); width: 90%; max-width: 600px; }
        h2 { margin-top: 0; text-align: center; color: #444; }
        .input-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; }
        input[type="text"], select { width: 100%; padding: 12px; font-size: 14px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; font-family: monospace; }
        select { background: white; }
        #drop-zone { border: 3px dashed #ccc; border-radius: 10px; padding: 40px 20px; text-align: center; color: #888; cursor: pointer; transition: all .3s; margin-bottom: 20px; position: relative; }
        #drop-zone.dragover { border-color: #007bff; background-color: #eef7ff; color: #007bff; }
        .progress-container { margin-top: 15px; display: none; }
        .progress-bg { background-color: #e9ecef; border-radius: 4px; height: 6px; width: 100%; overflow: hidden; }
        #progress-bar { width: 0%; height: 100%; background-color: #007bff; transition: width .1s; }
        .progress-info { display: flex; justify-content: space-between; font-size: 12px; color: #666; margin-top: 5px; font-family: monospace; }
        #result-box { padding: 15px; border-radius: 8px; border: 2px solid transparent; background-color: #f9f9f9; text-align: center; font-weight: bold; display: none; }
        #result-box.status-neutral { background-color: #f0f0f0; border-color: #ccc; }
        #result-box.status-match { background-color: #d4edda; border-color: #28a745; color: #155724; }
        #result-box.status-mismatch { background-color: #f8d7da; border-color: #dc3545; color: #721c24; }
        .hash-display { font-family: monospace; word-break: break-all; margin-top: 5px; font-weight: normal; }
    </style>
</head>
<body>
    <div class="container">
        <h2>文件哈希校验器</h2>
        <div class="input-group">
            <label for="hash-algorithm">校验算法:</label>
            <select id="hash-algorithm">
                <option value="MD5">MD5</option>
                <option value="SHA-1">SHA-1</option>
                <option value="SHA-256">SHA-256</option>
                <option value="SHA-384">SHA-384</option>
                <option value="SHA-512">SHA-512</option>
            </select>
        </div>
        <div class="input-group">
            <label for="expected-hash" id="expected-label">对比值 (输入正确的 MD5):</label>
            <input type="text" id="expected-hash" placeholder="在此粘贴 MD5..." autocomplete="off" spellcheck="false">
        </div>
        <div id="drop-zone">
            <p style="margin:0; font-size:1.1em; font-weight:bold;">拖入文件 / 点击选择</p>
            <p style="margin:5px 0 0; font-size:0.9em; opacity:0.7;">支持大文件，本地分块处理</p>
            <input type="file" id="file-input" style="display: none;">
            <div class="progress-container" id="progress-container">
                <div class="progress-bg"><div id="progress-bar"></div></div>
                <div class="progress-info"><span id="speed-display">0 MB/s</span><span id="percent-display">0%</span></div>
            </div>
        </div>
        <div id="result-box" role="status" aria-live="polite">
            <div id="status-text"></div>
            <div class="hash-display" id="calculated-hash"></div>
        </div>
    </div>
    <script>
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');
        const expectedInput = document.getElementById('expected-hash');
        const algorithmInput = document.getElementById('hash-algorithm');
        const expectedLabel = document.getElementById('expected-label');
        const resultBox = document.getElementById('result-box');
        const statusText = document.getElementById('status-text');
        const calculatedHashDisplay = document.getElementById('calculated-hash');
        const progressContainer = document.getElementById('progress-container');
        const progressBar = document.getElementById('progress-bar');
        const speedDisplay = document.getElementById('speed-display');
        const percentDisplay = document.getElementById('percent-display');

        let selectedFile = null;
        let activeReader = null;
        let calculationId = 0;
        let currentCalculatedHash = '';

        dropZone.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length) selectFile(e.target.files[0]);
            fileInput.value = ''; // 允许再次选择同一个文件
        });
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });
        dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            if (e.dataTransfer.files.length) selectFile(e.dataTransfer.files[0]);
        });
        expectedInput.addEventListener('input', compareHash);
        algorithmInput.addEventListener('change', () => {
            const algorithm = algorithmInput.value;
            expectedLabel.textContent = `对比值 (输入正确的 ${algorithm}):`;
            expectedInput.placeholder = `在此粘贴 ${algorithm}...`;
            if (selectedFile) processFile(selectedFile);
        });

        function selectFile(file) {
            selectedFile = file;
            processFile(file);
        }

        function processFile(file) {
            const id = ++calculationId;
            if (activeReader && activeReader.readyState === FileReader.LOADING) activeReader.abort();
            activeReader = null;
            currentCalculatedHash = '';
            resultBox.style.display = 'none';
            resultBox.className = '';
            progressContainer.style.display = 'block';
            progressBar.style.width = '0%';
            percentDisplay.textContent = '0%';
            speedDisplay.textContent = 'Preparing...';

            const algorithm = algorithmInput.value;
            const hasher = algorithm === 'MD5'
                ? new SparkMD5.ArrayBuffer()
                : new jsSHA(algorithm, 'ARRAYBUFFER');
            const chunkSize = 2097152;
            const chunks = Math.ceil(file.size / chunkSize);
            let currentChunk = 0;
            let loadedBytes = 0;
            const startTime = performance.now();
            const reader = new FileReader();
            activeReader = reader;

            function digest() {
                return algorithm === 'MD5' ? hasher.end() : hasher.getHash('HEX');
            }
            function finish() {
                if (id !== calculationId) return;
                activeReader = null;
                currentCalculatedHash = digest();
                progressContainer.style.display = 'none';
                resultBox.style.display = 'block';
                calculatedHashDisplay.textContent = algorithm + ': ' + currentCalculatedHash;
                compareHash();
            }
            function loadNext() {
                if (id !== calculationId) return;
                const start = currentChunk * chunkSize;
                reader.readAsArrayBuffer(file.slice(start, Math.min(start + chunkSize, file.size)));
            }
            reader.onload = (e) => {
                if (id !== calculationId) return;
                if (algorithm === 'MD5') hasher.append(e.target.result);
                else hasher.update(e.target.result);
                currentChunk++;
                loadedBytes += e.target.result.byteLength;
                const percent = Math.floor(currentChunk / chunks * 100);
                const elapsed = (performance.now() - startTime) / 1000;
                progressBar.style.width = percent + '%';
                percentDisplay.textContent = percent + '%';
                speedDisplay.textContent = elapsed > 0 ? (loadedBytes / 1048576 / elapsed).toFixed(1) + ' MB/s' : '0 MB/s';
                if (currentChunk < chunks) loadNext();
                else finish();
            };
            reader.onerror = () => {
                if (id !== calculationId) return;
                activeReader = null;
                currentCalculatedHash = '';
                progressContainer.style.display = 'none';
                resultBox.className = 'status-mismatch';
                resultBox.style.display = 'block';
                statusText.textContent = '读取文件出错！';
                calculatedHashDisplay.textContent = '';
            };

            if (chunks === 0) finish();
            else loadNext();
        }

        function compareHash() {
            if (!currentCalculatedHash) return;
            const expected = expectedInput.value.trim().toLowerCase();
            const calculated = currentCalculatedHash.toLowerCase();
            if (!expected) {
                resultBox.className = 'status-neutral';
                statusText.textContent = '计算完成';
            } else if (expected === calculated) {
                resultBox.className = 'status-match';
                statusText.textContent = '✅ 验证成功 (MATCH)';
            } else {
                resultBox.className = 'status-mismatch';
                statusText.textContent = '❌ 验证失败 (MISMATCH)';
            }
        }
    </script>
</body>
</html>
